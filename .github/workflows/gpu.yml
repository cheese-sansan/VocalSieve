name: GPU release gate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vocalsieve-gpu-gate
  cancel-in-progress: false

jobs:
  windows-and-docker:
    if: github.actor == github.repository_owner && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, Windows, X64, vocalsieve-gpu]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
      - name: Prepare runner Python
        shell: powershell
        run: |
          $python = "${{ vars.VOCALSIEVE_PYTHON_PATH }}"
          if (-not (Test-Path -LiteralPath $python)) { throw "VOCALSIEVE_PYTHON_PATH is invalid" }
          & $python --version
          uv sync --frozen --extra tui --extra api --python $python
          if ($LASTEXITCODE -ne 0) { throw "Locked Python dependency sync failed" }
      - name: Windows native CUDA inference
        shell: powershell
        run: |
          & ".venv/Scripts/python.exe" -m vocalsieve doctor --deep --device cuda --model tiny
          if ($LASTEXITCODE -ne 0) { throw "Native CUDA inference failed" }
      - name: Ensure Docker Desktop is ready
        shell: powershell
        run: |
          $deadline = (Get-Date).AddMinutes(5)
          do {
            docker info *> $null
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds 5
          } while ((Get-Date) -lt $deadline)
          throw "Docker Desktop did not become ready"
      - name: Build Linux GPU image
        shell: powershell
        run: |
          $base = "${{ vars.VOCALSIEVE_GPU_BASE }}"
          if ($base) {
            docker build --build-arg "GPU_BASE=$base" --target gpu -t vocalsieve:gpu-test .
          } else {
            docker build --target gpu -t vocalsieve:gpu-test .
          }
          if ($LASTEXITCODE -ne 0) { throw "GPU image build failed with exit code $LASTEXITCODE" }
      - name: Linux container CUDA inference
        run: docker run --rm --gpus all vocalsieve:gpu-test doctor --deep --device cuda --model tiny
